experience:
  - role: Principal Researcher
    org: LK Jam – A Real-Time Interactive AI System for Jam Sessions Based on the GRU Model
    start: 2026-01-01
    end: 2026-12-31
    summary: |
      Led the full independent research project, including engineering architecture design, GRU-based time-series model training, MIDI dataset preprocessing, and real-time performance interaction. Designed a Python/C hybrid architecture with a custom shared-memory mechanism and high-precision timeline synchronization.
  - role: Core Researcher
    org: Sonic Structuring · Layered Imaging · Collaborative Resonance
    start: 2025-11-01
    end: 2026-11-30
    summary: |
      University-level research project at Shenyang Conservatory of Music. Designed interactive XR stage logic, implemented AI interaction workflows, and developed 5.1 surround sound spatialization for live experimental electroacoustic performance. Advisors: Assoc. Prof. Dong Liu and Senior Eng. Hai Luan.
  - role: Core Researcher & Lead Developer
    org: Qinmai Zhixu: AI Rebirth of Endangered Guqin Melodies
    start: 2025-12-01
    end: 2026-06-30
    summary: |
      Challenge Cup Entrepreneurship Competition project focused on deep learning-based temporal modeling for Zhucheng School Guqin style reconstruction and digital heritage. Engineered a GRU-based generative pipeline for Guqin MIDI dataset curation, feature engineering, model training, and real-time MIDI output deployment.
  - role: Core Researcher
    org: Exploration of VR Live Interactive Remote Dual-Stage Concert via 5G and Campus Network Integration
    start: 2024-10-01
    end: 2025-05-31
    summary: |
      Ministry of Education Industry-University-Research Project. Responsible for dual-venue layout design, acoustic environment construction, and the project conclusion thesis. The project led to a follow-up grant on data security and information assurance for cross-regional dual-stage concerts.

