bio: |
  Yakun Liu is a graduate student in Electronic Music Composition at Shenyang Conservatory of Music. His research focuses on deep learning-based symbolic music generation, real-time human-computer interaction AI systems, and audio-visual cross-modal interaction for new media art. His creative and technical work bridges electroacoustic composition, AI-assisted music generation, XR performance, VR live streaming, and digital heritage reconstruction.

